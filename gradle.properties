#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# NOTE: The Gradle JVM must be JDK 17+ (AGP / SQLDelight reject JRE 8).
# Set `org.gradle.java.home` in your USER-level gradle properties
# (~/.gradle/gradle.properties) or via the JAVA_HOME env var — do not hardcode
# a machine-specific path here, as it breaks the build on other machines.

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true